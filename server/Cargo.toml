[package]
name = "waifu-sync"
version = "2.1.0"
edition = "2021"
license = "MIT"
[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
rusqlite = { version = "0.37", features = ["bundled"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[profile.release]
strip = true
