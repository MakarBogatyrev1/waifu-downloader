# Include from the http context (Ubuntu: /etc/nginx/sites-enabled/).
# This file defines only the new host. Existing virtual hosts stay in place.
limit_req_zone $binary_remote_addr zone=waifu_general:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=waifu_auth:1m rate=3r/m;
server {
    listen 80;
    listen [::]:80;
    server_name waifudownload.hopto.org;
    client_max_body_size 16k;
    limit_req_status 429;
    add_header Cache-Control "no-store" always;
    location ^~ /auth/ {
        limit_req zone=waifu_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 35s;
        access_log off;
    }
    location / {
        limit_req zone=waifu_general burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 35s;
    }
}
