name: waifu-sync
services:
  sync:
    build: ./server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      BIND_ADDRESS: "0.0.0.0:8787"
      DATABASE_PATH: "/data/waifu-sync.sqlite3"
    volumes:
      - sync-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 20s
volumes:
  sync-data:
